name: mkr-gate

# G5's CI half (specs/M3_Guardrails_Spec.md §7.9): the `→ CI` hard half of docs/DESIGN.md §4's
# G4 row that M2 deferred here, plus an ADR-uniqueness backstop for a clone that never had
# id-collision-guard.sh installed, plus the configured MKR_TEST/COVERAGE/TYPECHECK/LINT/BUILD
# commands (bootstrapped first by the optional MKR_SETUP, for a repo that needs its own
# multi-step setup — installing workspace packages, selecting a runtime version, etc. — before
# any of those commands mean anything on a real monorepo). MKR_PROTECTED_BRANCHES is statically
# listed below (this repo's own .mkr/config, re-derived by hand if that list ever changes) since
# a workflow trigger can't shell out to config.sh before checkout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run at a time per ref; a new push cancels a stale run already in flight for the same ref.
concurrency:
  group: mkr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Least-privilege: this job only ever reads the checkout, never calls the GitHub API or
    # writes anything — self-enforces the least-privilege `contents: read` this project's own
    # fork-PR-CI threat model already accepts as the baseline, instead of depending on a
    # per-repo default setting.
    permissions:
      contents: read
    # Bounds a fork-PR-controlled MKR_TEST/MKR_LINT/etc. value from spinning the runner
    # indefinitely — this project's own named threat for a fork PR's untrusted config values.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run MKR_SETUP (repo bootstrap, if configured)
        run: |
          set -uo pipefail
          setup="$(bash .claude/hooks/lib/config.sh get MKR_SETUP)"
          if [ -n "$setup" ]; then
            echo "== running MKR_SETUP: $setup =="
            bash -c "$setup"
          fi

      - name: Run configured test/coverage/typecheck/lint/build commands
        run: |
          set -uo pipefail
          bash .claude/hooks/lib/config.sh dump > /tmp/mkr-config-dump.txt
          cat /tmp/mkr-config-dump.txt
          while IFS='=' read -r name value; do
            case "$name" in
              MKR_TEST|MKR_COVERAGE|MKR_TYPECHECK|MKR_LINT|MKR_BUILD)
                if [ -n "$value" ]; then
                  echo "== running $name: $value =="
                  bash -c "$value"
                fi
                ;;
            esac
          done < /tmp/mkr-config-dump.txt

      - name: Check ADR-number uniqueness
        run: |
          set -uo pipefail
          # nullglob so zero ADRs (the normal starting state for every fresh adopter, not just
          # this repo) expands the glob to nothing instead of passing the literal, unexpanded
          # pattern to `ls` — which fails and, under this step's own pipefail, would abort the
          # step even though zero duplicates is the correct, passing case.
          shopt -s nullglob
          adr_dir="$(bash .claude/hooks/lib/config.sh get MKR_ADR_DIR)"
          adr_dir="${adr_dir%/}"
          dup="$(ls "$adr_dir"/[0-9][0-9][0-9][0-9]-*.md 2>/dev/null \
            | sed -E 's#.*/([0-9]{4})-.*#\1#' | sort | uniq -d)"
          if [ -n "$dup" ]; then
            echo "duplicate ADR number(s): $dup" >&2
            exit 1
          fi

      - name: Check .claude/mkr-manifest integrity
        # specs/M3_Guardrails_Spec.md §7.8: mkr-code-reviewer/mkr-security-reviewer are
        # deliberately Read/Grep/Glob-only (no Bash) — neither can compute a SHA-256 or stat a
        # file's mode bits, so neither can ever itself catch a manifest that has drifted from the
        # files it claims to describe (accidental, or a PR quietly editing a hook's bytes without
        # updating its recorded hash). This is the Bash-capable check that can — logic lives in
        # .claude/hooks/lib/manifestcheck.sh (sourced, tested directly in tests/hooks_test.sh),
        # the same split this workflow already uses for the review-record check below and
        # reviewrecord.sh. Inert, not a failure, on a repo with no manifest at all (this repo's
        # own checkout included — mkrdlc is the template source, never installed against itself).
        run: |
          set -uo pipefail
          . .claude/hooks/lib/manifestcheck.sh
          if ! out="$(manifestcheck_verify "$(pwd)")"; then
            printf '%s\n' "$out" >&2
            echo "manifest integrity check failed — see mismatches above" >&2
            exit 1
          fi
          [ -n "$out" ] && printf '%s\n' "$out"
          echo "manifest integrity OK"

      - name: Require a G4 review record for this commit
        env:
          # On `pull_request`, $GITHUB_SHA is GitHub's own synthetic merge commit
          # (refs/pull/N/merge), not the PR head commit mkr-code-review actually names its
          # review record after — a real, security-review-caught defect in an earlier revision
          # of this workflow. The PR head SHA is what must be checked.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The real, trusted prior tip of the protected branch, GitHub's own record — not
          # attacker-forgeable the way a commit's own parent metadata is (docs/adr/0008's AD-3).
          # On `push`, `github.event.before` (the ref's real tip immediately before this push). On
          # `pull_request`, `github.event.pull_request.base.sha` — this workflow's own
          # `pull_request` trigger is scoped to `branches: [main]` (top of this file), so this is
          # always GitHub's own recorded tip of `main` itself at the time this PR event fired,
          # never an attacker-influenceable branch (docs/adr/0011). Needed for the same reason on
          # both events: `find_review_record`'s ancestor-check (docs/adr/0010) lets a trailing
          # docs-only/audit-only commit resolve immediately once it's provably at-or-behind this
          # value — without it, a PR whose head commit's immediate parent is a merge commit (this
          # repo's own `mkr-merge` default strategy; `branch-guard.sh` forces every change,
          # including a grounding-audit record, through a PR) can never resolve on its own
          # `pull_request`-triggered check, only on the `push`-triggered re-check after merge.
          EXPECTED_PRIOR_TIP: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          set -uo pipefail
          . .claude/hooks/lib/reviewrecord.sh
          reviews_dir="$(bash .claude/hooks/lib/config.sh get MKR_REVIEWS_DIR)"
          reviews_dir="${reviews_dir%/}"
          specs_dir="$(bash .claude/hooks/lib/config.sh get MKR_SPECS_DIR)"
          specs_dir="${specs_dir%/}"
          short="${TARGET_SHA:0:7}"
          # git's all-zero sentinel (theoretically possible on a ref's very first push) never names
          # a real commit — mapped to empty, the same "no attestation" treatment
          # pre-push-review-guard.sh already gives it.
          ZERO_SHA='0000000000000000000000000000000000000000'
          [ "$EXPECTED_PRIOR_TIP" = "$ZERO_SHA" ] && EXPECTED_PRIOR_TIP=""
          # A record committed as a separate trailing commit (this repo's own convention) can
          # never name its own sha — checked via find_review_record's bounded non-code-commit-chain
          # fallback before failing (walks back through a small, fixed number of consecutive
          # reviews/specs/ADR/audit-only commits — the last so a post-merge `mkr-audit` grounding
          # record, pushed as its own trailing commit, doesn't itself trip this check; this job's
          # own `fetch-depth: 0` checkout above gives it the full history that walk needs). A merge
          # commit (a real `gh pr merge --merge`
          # output) resolves via its second parent only once its first parent is confirmed to
          # equal EXPECTED_PRIOR_TIP — never derived from TARGET_SHA
          # itself.
          if ! record="$(find_review_record "$TARGET_SHA" "$reviews_dir" "$specs_dir" "$EXPECTED_PRIOR_TIP")"; then
            echo "no G4 review record for commit $TARGET_SHA (checked $reviews_dir/$short.md and, if applicable, a bounded chain of its ancestors)" >&2
            exit 1
          fi
          echo "found G4 review record: $record"
